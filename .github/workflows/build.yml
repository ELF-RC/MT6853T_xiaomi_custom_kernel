name: Build Kernel

on:
  push:
    branches:
      - main
      - main_2.6GHz
      - KernelSU
      - KernelSU_2.6GHz
      - development
  pull_request:
    branches:
      - main
      - main_2.6GHz
      - KernelSU
      - KernelSU_2.6GHz
      - development
  workflow_dispatch:
    inputs:
        LOCALVERSIONNAME:
            description: 'Kernel Local Version Name'
            required: true
            default: ''

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCALVERSION_NAME: ${{ github.event.inputs.LOCALVERSIONNAME || 'ci' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["main","main_2.6GHz","KernelSU","KernelSU_2.6GHz","development"]' || format('["{0}"]', github.event_name == 'pull_request' && 'pr' || github.ref_name)) }}

    steps:

      - name: Configure 5 GiB swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 5G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install build-essential lld libssl-dev libelf-dev flex bison bc curl git time zip llvm -y

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch == 'pr' && github.event.pull_request.head.sha || matrix.branch }}
          submodules: recursive

      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Toolchain
        run: |
          git clone --depth=1 https://github.com/ELF-RC/android_kernel4x_tools.git tooltmp

      - name: Prepare build variables
        run: |
          echo "$GITHUB_WORKSPACE/tooltmp/clang/host/linux-x86/clang-r428724/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/tooltmp/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/tooltmp/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=Github-Action" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=${GITHUB_ACTOR,,}" >> "$GITHUB_ENV"
          jobs="$(nproc)"
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "::notice::Using $jobs CPUs for the kernel build"

      - name: Configure Kernel
        run: |
          make -j"$BUILD_JOBS" O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ LLVM_IAS=1 \
            KCFLAGS="--target=aarch64-linux-gnu" \
            LOCALVERSION="-${LOCALVERSION_NAME}" \
            cannon_defconfig

      - name: Assert defconfig truth
        run: |
          set -euo pipefail
          cfg=out/.config
          test -f "$cfg"
          branch='${{ matrix.branch }}'
          if [ "$branch" = "pr" ]; then
            branch='${{ github.base_ref }}'
          fi
          echo "Validating .config for branch=$branch"
          # Branch policy checks
          case "$branch" in
            main|main_2.6GHz)
              if grep -qE '^CONFIG_KSU=y' "$cfg"; then
                echo "::error::main and main_2.6GHz must not enable CONFIG_KSU"
                exit 1
              fi
              ;;
            development)
              # development is intentionally permissive (SELinux forced off in source).
              # Allow CONFIG_KSU only if sources exist; currently expected off.
              echo "development: permissive SELinux policy preserved in source"
              ;;
            KernelSU|KernelSU_2.6GHz)
              grep -qE '^CONFIG_KSU=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU=y"; exit 1; }
              grep -qE '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"; exit 1; }
              grep -qE '^CONFIG_KSU_FEATURE_SULOG=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_FEATURE_SULOG=y"; exit 1; }
              grep -qE '^CONFIG_KSU_FEATURE_ADBROOT=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_FEATURE_ADBROOT=y"; exit 1; }
              grep -qE '^# CONFIG_KSU_DEBUG is not set' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_DEBUG to be disabled"; exit 1; }
              grep -qE '^CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y"; exit 1; }
              grep -qE '^CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$cfg" || { echo "::error::KernelSU branches require CONFIG_KSU_LSM_SECURITY_HOOKS=y"; exit 1; }
              ;;
          esac
          echo "defconfig assertions passed"

      - name: Build Kernel Image
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE"
          timeout --foreground --signal=TERM --kill-after=2m 35m \
            nice -n 5 /usr/bin/time -v \
            make -j"$BUILD_JOBS" O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip \
            HOSTCC=clang HOSTCXX=clang++ LLVM_IAS=1 \
            KCFLAGS="--target=aarch64-linux-gnu" \
            LOCALVERSION="-${LOCALVERSION_NAME}" \
            Image.gz-dtb
          echo "::notice::Kernel make exited successfully"

      - name: Verify Kernel Image
        run: |
          image=out/arch/arm64/boot/Image.gz-dtb
          test -s "$image"
          ls -lh "$image"
          sha256sum "$image"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Pack Kernel with Installer
        run: |
          git clone --depth=1 https://github.com/ELF-RC/cannon_kernel_installer.git installer
          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb installer/
          sed -i "s/ELF-RC/${{ github.actor }}/g" installer/tools/env_prepare.sh
          cd installer
          rm -rf .git

      - name: Record build time
        id: buildtime
        run: echo "time=$(TZ='Asia/Shanghai' date +'%Y%m%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload Kernel Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cannon_${{ matrix.branch }}_${{ steps.revision.outputs.sha }}_${{ env.LOCALVERSION_NAME }}_${{ github.actor }}_${{ steps.buildtime.outputs.time }}
          path: installer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
